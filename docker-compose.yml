# clone 후 `docker compose up` 한 번으로 백엔드 + MySQL이 뜬다.
#
# 목적은 "내 컴퓨터에서는 되는데요"를 없애는 것이다. MySQL 버전, 문자셋, 초기 스키마까지
# 코드로 고정해두면 새 환경에서 재현이 되고, 리뷰어도 5분 안에 실행해볼 수 있다.
#
# 비밀번호와 JWT 키는 저장소에 두지 않는다. 같은 폴더의 .env(.gitignore 대상)에서 읽는다.
#   cp .env.example .env   → 세 값을 채운 뒤 docker compose up
# 값이 비어 있으면 compose가 기동 전에 멈추고 어떤 값이 빠졌는지 알려 준다.
# 배포 환경(Render)에는 이 값과 다른 값을 그쪽 환경변수로 넣는다.

services:
  mysql:
    image: mysql:8.0
    container_name: finbank-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?.env에 MYSQL_ROOT_PASSWORD를 채우세요 (cp .env.example .env)}
      MYSQL_USER: finuser
      MYSQL_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD를 채우세요 (cp .env.example .env)}
      TZ: Asia/Seoul
    ports:
      # 내 컴퓨터(127.0.0.1)에만 연다 — 앞에 주소를 안 붙이면 같은 와이파이의 다른 기기에서도 접속을 시도할 수 있다
      # 호스트 포트가 다른 프로세스에 물려 있으면 MYSQL_HOST_PORT=3307 docker compose up 처럼 바꿔서 실행
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      # 스키마 두 개(개발용/테스트용)를 최초 기동 시 생성
      - ./docker/mysql-init:/docker-entrypoint-initdb.d
      - finbank-mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      # 애플리케이션이 "DB가 준비된 뒤에" 뜨도록 — 없으면 기동 순서 때문에 간헐적으로 실패한다
      # $$는 compose 치환을 건너뛰고 컨테이너 안의 환경변수를 쓰게 한다 (비밀번호를 파일에 적지 않기 위해)
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./finbank-backend
    container_name: finbank-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 컨테이너 안에서는 localhost가 아니라 서비스 이름으로 DB를 찾는다
      DB_URL: jdbc:mysql://mysql:3306/finbank?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
      DB_USERNAME: finuser
      DB_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD를 채우세요 (cp .env.example .env)}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?.env에 JWT_SECRET_KEY를 채우세요 (cp .env.example .env)}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  finbank-mysql-data:
