name: CI

# 언제 도는가: main/develop으로의 push와 모든 PR.
# "머지 전에 빨간불이면 못 들어온다"를 자동으로 만드는 것이 목적이다.
on:
  push:
    branches: [ main, develop ]
  pull_request:

# 같은 브랜치에서 새 커밋이 오면 이전 실행은 취소한다 (러너 낭비 방지)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 백엔드 빌드 · 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # 통합 테스트가 실제 MySQL을 요구한다(동시성·격리수준 동작을 H2로는 검증할 수 없다).
    # 잡마다 컨테이너가 새로 뜨므로 로컬 DB 상태에 오염되지 않는다.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: finbank
          MYSQL_USER: finuser
          MYSQL_PASSWORD: finpass1234
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # application.yml의 ${...} 자리를 채운다.
      # 로컬은 gitignore된 application-local.yml이 채우고, CI는 환경변수가 채운다.
      DB_USERNAME: finuser
      DB_PASSWORD: finpass1234
      JWT_SECRET_KEY: CiOnlyJwtSecretKeyForFinbankIntegrationTests1234567890

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 설정 (Gradle 캐시 포함)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: MySQL 기동 대기
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u finuser -pfinpass1234 --silent; then
              echo "MySQL ready"; exit 0
            fi
            echo "waiting for mysql... ($i)"; sleep 3
          done
          echo "MySQL이 준비되지 않았습니다."; exit 1

      - name: 빌드 · 테스트
        working-directory: finbank-backend
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build

      # 실패했을 때 무엇이 왜 깨졌는지 보려면 리포트가 필요하다.
      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: |
            finbank-backend/build/reports/tests/test
            finbank-backend/build/test-results/test
          retention-days: 7

  frontend:
    name: 프론트엔드 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Node 20 설정 (npm 캐시 포함)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: finbank-frontend/package-lock.json

      - name: 의존성 설치
        working-directory: finbank-frontend
        run: npm ci

      - name: 빌드
        working-directory: finbank-frontend
        run: npm run build
