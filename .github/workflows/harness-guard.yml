name: Harness Guard

# 판정 기준(불변식·하네스·케이스 파일·가드 스크립트·에이전트 설정·CI)이 바뀐 PR은
# 사람이 oracle-approved 라벨을 붙여야 통과한다. 1인 저장소에서는 CODEOWNERS 승인이
# 실효가 없어서(본인 PR을 본인이 승인할 수 없음) 라벨로 승인을 표시한다.
# 경로 목록의 단일 출처: scripts/harness/harness_rules.py
#
# pull_request_target으로 도는 이유: pull_request는 PR에 담긴 워크플로·가드 스크립트로 실행돼서,
# 규칙 파일이나 이 워크플로를 고친 PR이 스스로를 통과시킬 수 있다. pull_request_target은 기준 브랜치의
# 워크플로로 돌고, 가드도 기준 브랜치의 코드로 실행한다. PR 코드는 실행하지 않고 바뀐 파일 이름만 본다.
# (가드 단위 테스트는 PR 코드를 돌려야 의미가 있으므로 ci.yml에 있다)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: 판정 기준 보호
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 기준 브랜치 받기 (믿을 수 있는 가드 코드)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0              # 기준 브랜치와 비교하려면 전체 이력이 필요하다
          persist-credentials: false

      - name: 판정 기준 변경 검사
        env:
          ORACLE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'oracle-approved') }}
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # 가드를 먼저 복사해 두고(기준 브랜치 코드), PR은 파일 목록을 보려고 꺼내기만 한다 — 실행하지 않는다
          cp -r scripts/harness "$RUNNER_TEMP/guard"
          git fetch --no-tags origin "pull/$PR_NUMBER/head:pr-head"
          git checkout --quiet --detach pr-head
          python3 "$RUNNER_TEMP/guard/diff_guard.py" --root "$GITHUB_WORKSPACE" --base "origin/$BASE_REF" --role pr
