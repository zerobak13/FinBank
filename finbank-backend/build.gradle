plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.2'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.finbank'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'com.mysql:mysql-connector-j'

    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'


    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-core'

    // Swagger / OpenAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // Flyway (MySQL)
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    // QueryDSL — 대출 목록의 동적 조건 검색(C4)에서 도입.
    // 문자열 JPQL을 if문으로 이어붙이면 오타나 공백 실수가 런타임에야 드러나지만,
    // QueryDSL은 컴파일 타임에 타입으로 잡힌다. jakarta 분류자는 Spring Boot 3(Jakarta EE 9+) 대응.
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
}

tasks.named('test') {
    // perf 태그는 10만 건을 적재하고 인덱스를 껐다 켜며 재는 측정용이라 매 커밋마다 돌릴 필요가 없다.
    // 기본 test에서 제외하고 아래 perfTest로 분리한다 (CI 시간 = 개발 피드백 속도).
    useJUnitPlatform {
        excludeTags 'perf'
    }
    // 벤치마크 테스트가 출력하는 표(System.out)를 콘솔에서 바로 볼 수 있게 한다.
    testLogging {
        showStandardStreams = true
        events "passed", "failed"
    }
}

// 성능 측정 전용 태스크 — 필요할 때만 수동 실행한다.
//   ./gradlew perfTest
tasks.register('perfTest', Test) {
    group = 'verification'
    description = '대량 데이터 기반 인덱스 성능 측정 (perf 태그)'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'perf'
    }
    testLogging {
        showStandardStreams = true
        events "passed", "failed"
    }
    outputs.upToDateWhen { false }   // 같은 코드라도 다시 재고 싶을 때가 있다
}
